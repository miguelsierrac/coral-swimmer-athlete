  <circle cx="95" cy="215" r="48" fill="url(#blueGrad)" stroke="#002d4d" stroke-width="5" />
  <text x="95" y="210" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">100%</text>
