    <line x1="85" y1="150" x2="95" y2="150" />
    <line x1="205" y1="150" x2="215" y2="150" />
    
    <line x1="104" y1="104" x2="111" y2="111" />
    <line x1="196" y1="104" x2="189" y2="111" />
    <line x1="196" y1="196" x2="189" y2="189" />
  </g>

  <rect x="110" y="110" width="80" height="70" rx="6" fill="#f0f0f0" stroke="#002d4d" stroke-width="4" />
  <path d="M 110 130 L 190 130" stroke="#002d4d" stroke-width="4" />
  <path d="M 110 116 Q 110 110 116 110 L 184 110 Q 190 110 190 116 L 190 130 L 110 130 Z" fill="url(#redGrad)" />
  
