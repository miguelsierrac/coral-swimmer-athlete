  <rect x="135" y="35" width="30" height="30" rx="4" fill="#002d4d" />
  <rect x="125" y="25" width="50" height="15" rx="4" fill="url(#blueGrad)" />
  
  <path d="M 80 75 L 65 60" stroke="#002d4d" stroke-width="12" stroke-linecap="round" />
  <path d="M 220 75 L 235 60" stroke="#002d4d" stroke-width="12" stroke-linecap="round" />
  
  <circle cx="150" cy="150" r="90" fill="url(#blueGrad)" stroke="#002d4d" stroke-width="6" />
  
