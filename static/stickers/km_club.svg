      <stop offset="100%" stop-color="#00C8FF" />
    </linearGradient>

    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="210" fill="white" filter="url(#stickerShadow)" />

  <circle cx="250" cy="250" r="185" fill="url(#odometerGrad)" stroke="#002d4d" stroke-width="4" />

  <circle cx="250" cy="250" r="140" fill="none" stroke="white" stroke-width="2" stroke-dasharray="2,10" opacity="0.4" />
  
  <g fill="white" transform="translate(210, 85)">
